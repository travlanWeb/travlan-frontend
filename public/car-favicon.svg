<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!--
    트래블랜 자동차 파비콘
    - 원본 좌표는 (0,0) 중심으로 그려져 있어서, translate(32, 34)로 캔버스 중앙에 오도록 이동시켰습니다.
    - 원래 코드의 clay ember 색상 변수는 브라우저 탭 아이콘에서 CSS 변수를 해석할 웹페이지 컨텍스트가 없어서
      고정 hex 값으로 바꿔 넣었습니다. 실제 페이지 안에서 쓰는 SVG라면 CSS 변수를 유지해도 됩니다.
  -->
  <g transform="translate(32, 40) scale(1.3)">
    <!-- 그림자 -->
    <ellipse cx="0" cy="10" rx="26" ry="3" fill="#000d10" opacity="0.15" />

    <!-- 차체 - Clay Ember 색상 -->
    <path
      d="M-24 -10 L-17 -10 L-12 -18 L12 -18 L17 -10 L24 -10 L24 4 L-24 4 Z"
      fill="#ff5a00"
    />

    <!-- 창문 - 살짝 어두운 톤으로 구분 -->
    <path
      d="M-14 -10 L-10 -16 L10 -16 L14 -10 Z"
      fill="#000d10"
      opacity="0.25"
    />

    <!-- 바퀴 - 검정 + 안쪽 살짝 밝은 원 -->
    <circle cx="-12" cy="7" r="5.5" fill="#000d10" />
    <circle cx="-12" cy="7" r="2" fill="#8e8e95" />
    <circle cx="12" cy="7" r="5.5" fill="#000d10" />
    <circle cx="12" cy="7" r="2" fill="#8e8e95" />
  </g>
</svg>
